name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  quality:
    name: lint + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff (errors only)
        run: ruff check .

      - name: Black (formatting)
        run: black --check .

      - name: Compile all modules
        run: |
          python -m py_compile config.py answer_utils.py frontend_check.py \
            pars_pdf.py embeddings.py gold_set.py index_to_vector_store.py \
            llm.py rag_pipeline.py retrieval_report.py test_full_pipeline.py \
            download_pdfs.py vector_store.py
          python -m py_compile webapp/*.py webapp/routers/*.py

      - name: Unit tests
        run: python -m pytest

      - name: JavaScript syntax
        run: node --check webapp/static/app.js
