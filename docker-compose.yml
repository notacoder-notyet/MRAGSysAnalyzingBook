# Запуск одной командой:  docker compose up --build
#
# Индекс Chroma и база SQLite лежат в ./data на хосте и монтируются в контейнер,
# поэтому индексацию достаточно выполнить один раз локально:
#   make download && make parse && make index
services:
  web:
    build: .
    image: mrag-web:latest
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health').status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
